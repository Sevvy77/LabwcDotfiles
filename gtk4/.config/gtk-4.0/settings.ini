# Crimson Dark for plain GTK4 apps (pavucontrol); libadwaita apps use the dark
# style plus gtk.css next to this file. On Wayland GTK reads these from
# GSettings instead, which install.sh sets to the same values.
[Settings]
gtk-theme-name=OB-Crimson-Dark
gtk-icon-theme-name=Adwaita
gtk-application-prefer-dark-theme=1
