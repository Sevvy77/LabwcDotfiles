# Crimson Dark for every GTK3 app (the theme is in
# ~/.local/share/themes/OB-Crimson-Dark). On Wayland GTK reads these from
# GSettings instead, which install.sh sets to the same values; this file
# covers apps started without a D-Bus session.
[Settings]
gtk-theme-name=OB-Crimson-Dark
gtk-icon-theme-name=Adwaita
gtk-application-prefer-dark-theme=1
